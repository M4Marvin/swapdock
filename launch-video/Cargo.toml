[package]
name = "launch-video"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "launch_video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "launch-video"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

