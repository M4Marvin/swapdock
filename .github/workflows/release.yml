name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            builder: cargo
          - target: aarch64-unknown-linux-musl
            builder: cross
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Resolve version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "could not read version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install musl tools (x86_64)
        if: matrix.builder == 'cargo'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build x86_64 musl natively
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Build aarch64 musl with cross
        if: matrix.builder == 'cross'
        env:
          # `cross` compiles natively in its target container; no QEMU is needed
          # for a build with no run/build-script steps. The default image for a
          # cross release can lag the crate's rust-version, so `:edge` is used
          # here (it tracks current stable). Pin a tag instead if reproducibility
          # matters more than the toolchain version.
          CROSS_CONFIG: ${{ runner.temp }}/Cross.toml
        run: |
          cat > "$CROSS_CONFIG" <<'EOF'
          [target.aarch64-unknown-linux-musl]
          image = ":edge"
          EOF
          cross build --release --locked --target "${{ matrix.target }}"

      - name: Strip and verify
        run: |
          bin="target/${{ matrix.target }}/release/swapdock"
          if file "$bin" | grep -q "not stripped"; then
            if [[ "${{ matrix.target }}" == aarch64-* ]]; then
              sudo apt-get update
              sudo apt-get install -y binutils-aarch64-linux-gnu
              aarch64-linux-gnu-strip "$bin"
            else
              strip "$bin"
            fi
          else
            echo "already stripped by the Cargo release profile"
          fi
          file "$bin"
          ldd "$bin" 2>&1 || true

      - name: Package dist tree
        run: |
          bash scripts/package-dist.sh \
            --no-build \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/swapdock"

      - name: Create archive
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="swapdock-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" swapdock-dist
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SBOM=swapdock-${version}-${{ matrix.target }}.spdx.json" >> "$GITHUB_ENV"
          ls -lh "$archive"
          tar -tzf "$archive" | head -n 20

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: target/${{ matrix.target }}/release/swapdock
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false

      - name: Sign archive and SBOM (keyless Sigstore)
        run: |
          cosign sign-blob --yes --bundle "${ARCHIVE}.sigstore.json" "$ARCHIVE"
          cosign sign-blob --yes --bundle "${SBOM}.sigstore.json" "$SBOM"
          ls -lh ./*.sigstore.json

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: swapdock-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SBOM }}
            ${{ env.ARCHIVE }}.sigstore.json
            ${{ env.SBOM }}.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build checksum manifest
        working-directory: release-assets
        run: |
          if ! ls ./*.tar.gz >/dev/null 2>&1; then
            echo "no release archives were downloaded" >&2
            exit 1
          fi
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          sed -i 's| \./| |' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Pre-launch release of swapdock. Read the README's "Project status"
          block and LAUNCH.md before installing. The API requires a bearer token
          by default and binds loopback; there is no built-in TLS or user
          session layer. Do not expose it to the internet without an
          authenticated TLS reverse proxy.

          ## Install from a source-independent archive

          ```bash
          tar -xzf swapdock-<version>-<target>.tar.gz
          sudo bash swapdock-dist/install-swapdock.sh swapdock-dist
          ```

          The installer supports `--dry-run` and `--with-service`; the systemd
          unit is not started by default and must stay bound to loopback.

          ## Verify

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          ## Signing and SBOM

          Archives and SPDX SBOMs are signed with Sigstore cosign in keyless
          mode using the GitHub Actions OIDC identity. Verify with:

          ```bash
          cosign verify-blob \
            --bundle swapdock-<version>-<target>.tar.gz.sigstore.json \
            --certificate-identity-regexp 'https://github.com/M4Marvin/swapdock/.github/workflows/release.yml@refs/tags/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            swapdock-<version>-<target>.tar.gz
          ```

          A checksum is still not a signature; verify the identity and issuer,
          not just that a bundle exists. See docs/release.md.

          ## Not ready for production

          swapdock is pre-launch. The deploy engine, installer, uninstaller and
          docs are still being hardened against the launch gates. Use it on a
          disposable host.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: swapdock ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.spdx.json
            release-assets/*.sigstore.json
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish-crate:
    name: Publish crate (optional)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty when the repository has no cargo registry token configured.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Publish or dry-run
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            cargo publish --locked
          else
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured; running cargo publish --dry-run instead"
            cargo publish --locked --dry-run
          fi
