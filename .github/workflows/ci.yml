name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Create the static e2e root
        # The static deploy test uses the real allowed root and skips when it
        # cannot write there; the runner can create it.
        run: sudo mkdir -p /srv/www && sudo chown "$(id -u):$(id -g)" /srv/www

      - name: Pull the e2e base image
        # e2e_strategies uses nginx:alpine as its test image; a clean runner
        # does not have it, and the test panics if it is missing.
        run: docker pull nginx:alpine

      - name: Test (unit, integration, Docker e2e)
        # The e2e tests skip themselves when no Docker daemon is available;
        # ubuntu-latest has one, so they normally run here.
        run: cargo test --locked --all-targets

      - name: Doc tests
        run: cargo test --locked --doc

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        # Blocking on purpose: a known vulnerable dependency fails the build.
        run: cargo audit

  web:
    name: Web (install, build, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  scripts:
    name: Scripts and docs links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Parse shell scripts
        run: bash -n scripts/*.sh install/*.sh

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck scripts/*.sh install/*.sh

      - name: Check docs links
        run: python3 scripts/check-docs-links.py
