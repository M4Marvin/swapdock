<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/geist-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="swapdock — blue/green deploys, rollbacks and host checks for a multi-app Docker estate."
    />
    <meta name="theme-color" content="#f8f8f9" />
    <title>swapdock</title>
    <script>
      // Apply the saved theme before first paint so the shell never flashes.
      (function () {
        try {
          var saved = localStorage.getItem("swapdock-theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0b" : "#f8f8f9");
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
