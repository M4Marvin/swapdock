# Example tunnel config. The tunnel id is fictional; replace it with yours.
# swapdock only reads the hostname-to-port routes below.
tunnel: 11111111-2222-3333-4444-555555555555
credentials-file: /home/user/.cloudflared/11111111-2222-3333-4444-555555555555.json

ingress:
  - hostname: example.com
    service: http://localhost:8001
  - hostname: shop.example.com
    service: http://localhost:8002
  - hostname: www.shop.example.com
    service: http://localhost:8002
  - hostname: docs.example.com
    service: http://localhost:8003
  - hostname: git.example.com
    service: http://localhost:8004
  - hostname: chat.example.com
    service: http://localhost:8005
  - service: http_status:404
