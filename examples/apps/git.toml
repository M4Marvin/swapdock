name = "git"
kind = "container"
strategy = "replace"
hostnames = ["git.example.com"]
listen = ["127.0.0.1"]
front_port = 8004
slot = 3
writes_state = true
image_repo = "example-git"
build_host = "local"
health_url = "http://127.0.0.1:3000/api/healthz"
compose_dir = "/srv/example/compose"
compose_svc = "git"
env_name = "GIT_PORT"
branch = "main"
