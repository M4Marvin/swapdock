name = "chat"
kind = "container"
strategy = "replace"
hostnames = ["chat.example.com"]
listen = ["127.0.0.1", "192.0.2.10"]
front_port = 8005
slot = 4
writes_state = true
image_repo = "example-chat"
registry = "local"
build_host = "local"
health_url = "http://127.0.0.1:3000/"
compose_dir = "/srv/example/compose"
compose_svc = "chat"
env_name = "CHAT_PORT"
git_remote = "example-org/chat"
branch = "main"
repo = "/srv/example/chat"
