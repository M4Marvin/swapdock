[package]
name = "swapdock"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Registry-driven blue/green deploys for a multi-app Docker host, behind an nginx front door"
license = "MIT"
repository = "https://github.com/M4Marvin/swapdock"
homepage = "https://github.com/M4Marvin/swapdock"
keywords = ["deploy", "docker", "nginx", "blue-green", "devops"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# `axum::response::sse` takes a `Stream`; `stream::unfold` is the whole of what
# this crate needs from it, so no async-stream or tokio-stream dependency.
futures-util = { version = "0.3", default-features = false, features = ["std"] }


[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Release profile tuned for a CLI that ships as a single static binary.
# `strip` and `lto` roughly halve the download; `panic = "abort"` keeps the
# binary small and turns a panic into a non-zero exit rather than unwinding.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
