# Shared by every front-door server block. Hand-written, never generated.
#
# deploy renders `include /etc/nginx/snippets/proxy-common.conf;` inside each
# container block, so every app gets these settings and no app can drift.
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# TLS ends at the Cloudflare edge; the tunnel hop is plain HTTP. Clients use
# https, so say so: apps that build absolute URLs depend on it.
proxy_set_header X-Forwarded-Proto https;

# Websocket support. $connection_upgrade comes from the map in
# conf.d/00-swapdock-http.conf. Harmless for plain HTTP apps, required for websockets.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;

# nginx defaults to 1 MB. If any app serves uploads, without this they fail
# with 413 and nothing else explains it.
client_max_body_size 0;
