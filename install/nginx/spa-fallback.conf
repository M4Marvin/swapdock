# SPA history fallback. swapdock includes this inside a static app's server
# block when the app sets `spa = true`.
#
# Extensionless paths are client-side routes: when no file matches, serve
# index.html so a hard refresh on a deep link works. Paths with a dot are
# assets and keep the generated `try_files $uri $uri/ =404` — a missing asset
# must never come back as index.html with a 200.
location ~ ^/[^.]*$ {
    try_files $uri $uri/ /index.html;
}
