# Hand-written http-level settings for the front door. Never generated.
#
# Lives in conf.d so it loads with the rest of nginx. The per-app server
# blocks live in front-door.conf next to it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The deploy tool's ground truth. `deploy verify` reads this back to prove
# traffic moved: which upstream answered, with what status, and when.
log_format swapdock '$time_iso8601 $host $status rt=$request_time '
                  'up=$upstream_addr us=$upstream_status';

# Bounds the drain window. Old workers close keepalive connections after one
# more request; 10 s keeps that tail short so `drain-wait` means something.
# Also affects the :80 default site, where it is equally harmless.
keepalive_timeout 10s;
