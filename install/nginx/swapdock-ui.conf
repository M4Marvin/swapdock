# Same-origin console: static SPA + /api proxy to the loopback API.
# Put Cloudflare Tunnel or a TLS server in front of this listener.
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/swapdock/ui;

    # Cloudflare Tunnel connects from loopback; trust only its addressing
    # header, not a client-supplied X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    index index.html;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, do not append: the app takes the first hop as the client key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
